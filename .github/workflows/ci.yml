# Everything that used to be checked by hand, or not at all.
#
# This repository had no CI. Every gate below — typecheck, lint, formatting,
# 260 fixtures, a real production build, and a read of the artifact that build
# produces — was something a person had to remember to run in a terminal before
# pushing, and production was therefore the first environment where the whole
# application was ever assembled.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push supersedes the first. Nobody needs the verdict on a commit
  # that is already behind.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the nodejs22.x runtime the Vercel function actually runs on.
          node-version: 22
          cache: npm

      # `npm ci` and not `npm install`: it fails on a lockfile that has drifted
      # from package.json, which is precisely the state this repo was in on
      # 2026-09-05 (a missing lru-cache entry) while deploying happily, because
      # the deploy used `npm install` and papered over it.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Formatting
        # `src` only. `scripts/` predates the formatter and reformatting it
        # would be a diff nobody asked for; the fleet-shared modules are
        # excluded in .prettierignore because formatting them breaks
        # byte-identity with six sibling repositories.
        run: npx prettier --check src

      - name: Production build
        run: npm run build

      # After the build on purpose. `src/lib/deploy-config.test.ts` reads the
      # generated `.vercel/output/config.json` and asserts the security headers
      # and function limits actually reached the artifact — which it can only do
      # once the artifact exists.
      - name: Fixtures, against the built output
        run: npm test

      - name: Service worker sanity
        run: |
          set -euo pipefail
          SW=.vercel/output/static/sw.js
          test -f "$SW" || { echo "no service worker was generated"; exit 1; }
          # A worker that precaches the sandbox template's leftovers, or its own
          # 218 kB source map, is a worker somebody's phone downloads for
          # nothing. Both shipped for weeks.
          ! grep -q "__grok" "$SW" || { echo "sandbox assets are back in the precache"; exit 1; }
          ! grep -q '\.map"' "$SW" || { echo "source maps are being precached"; exit 1; }
          grep -q '"/species"' "$SW" || { echo "the manifest shortcut is not precached"; exit 1; }
          echo "service worker looks right"
